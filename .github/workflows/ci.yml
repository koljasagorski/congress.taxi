name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Schnell: Lint, Typen, Tests ohne OSRM (Live-Tests werden übersprungen)
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: mitfahrer
          POSTGRES_USER: mitfahrer
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitfahrer -d mitfahrer"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mitfahrer
      POSTGRES_USER: mitfahrer
      POSTGRES_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  # Nachweis „frischer Linux-Host“: env -> OSRM-Vorbereitung (Hamburg) -> Stack -> Tests inkl. OSRM
  # Zwei Wege: Dev-Env-Generator und der wörtliche DoD-Pfad (cp .env.example .env, Produktionsmodus).
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env_mode: [make-env-dev, cp-env-example]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Konfiguration erzeugen (make env DEV=1)
        if: matrix.env_mode == 'make-env-dev'
        run: sh scripts/init-env.sh dev
      - name: Konfiguration per cp .env.example .env (APP_ENV=production, Platzhalter-Secrets)
        if: matrix.env_mode == 'cp-env-example'
        # Einzige Abweichung: Hamburg statt germany-latest (4,9 GB, zu groß für den Runner)
        run: |
          cp .env.example .env
          awk '/^OSRM_PBF_URL=/ {print "OSRM_PBF_URL=https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf"; next} {print}' .env > .env.tmp
          mv .env.tmp .env
          grep -E '^(APP_ENV|POSTGRES_PASSWORD|JWT_SECRET)=' .env
      - name: Compose-Datei validieren
        run: docker compose config --quiet
      - name: OSRM-Daten vorbereiten
        run: make osrm-prepare
      - name: Stack starten
        run: make up
      - name: Readiness prüfen
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/health/ready
      - name: Tests (inkl. OSRM-Live-Tests)
        run: |
          cd api && uv sync --frozen && cd ..
          make test
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Betrieb (Phase 7): Shell-Skripte, Caddyfile, Backup-Roundtrip (Wegwerf-PostGIS) und
  # Caddy-Wegwerfaufbau. Voraussetzungen fehlen -> Fehler statt Überspringen (REQUIRE_OPS_TESTS).
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_OPS_TESTS: "1"
      POSTGIS_IMAGE: postgis/postgis:16-3.5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: age installieren (Backup-Verschlüsselung)
        run: sudo apt-get update && sudo apt-get install -y age
      - name: shellcheck
        run: shellcheck -x scripts/backup.sh scripts/restore.sh caddy/entrypoint.sh caddy/tile-origin.sh e2e/stack.sh
      - run: cd api && uv sync --frozen
      - name: Compose-Datei validieren (ohne Ausgabe der Werte)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile proxy config --quiet
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml --profile proxy config --quiet
      - name: Backup-Roundtrip, Compose-Konfiguration, Caddy-Aufbau (nginx-Platzhalter und echte API)
        run: |
          cd api
          uv run pytest -q tests/test_security_backup.py tests/test_security_backup_purge.py tests/test_compose_config.py tests/test_security_caddy.py tests/test_security_caddy_api.py

  # --- web (Phase 6): Typen, Lint, Tests, Build, Prüfung auf externe URLs, Container-Image ---
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:external
      - name: Container-Image bauen (nginx, baut und prüft die SPA erneut)
        run: docker build --pull -t mitfahrer-web:ci .

  # --- e2e (Phase 8): Playwright gegen den echten Stack (Caddy -> SPA + API -> PostGIS + OSRM Hamburg) ---
  # Eigenes Compose-Projekt "mitfahrer-e2e" (e2e/stack.sh): HTTP ohne TLS, Kachelserver ist ein Platzhalter-Host,
  # den die Tests selbst beantworten (kein Internet nötig), Rate-Limits nur hier angehoben.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Konfiguration für die OSRM-Vorbereitung erzeugen (make env DEV=1, Hamburg-Extrakt)
        run: sh scripts/init-env.sh dev
      # Die aufbereiteten Hamburg-Daten ändern sich für die Tests nicht; der Schlüssel enthält die OSRM-Version.
      # Bei einem Treffer überspringt make osrm-prepare Download und Aufbereitung von selbst.
      - name: OSRM-Daten aus dem Cache holen
        uses: actions/cache@v6.1.0
        with:
          path: data/osrm
          key: osrm-hamburg-v26.4.0-1
      - name: OSRM-Daten vorbereiten (übersprungen bei Cache-Treffer)
        run: make osrm-prepare
      - name: Playwright installieren
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Browser-Cache
        id: browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Chromium installieren (mit Systemabhängigkeiten)
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Systemabhängigkeiten für Chromium (Browser aus dem Cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Typen der Tests prüfen
        working-directory: e2e
        run: npm run typecheck
      - name: E2E-Stack starten
        run: sh e2e/stack.sh up
      - name: Playwright-Tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:18080
      - name: Stack-Logs bei Fehler
        if: failure()
        run: sh e2e/stack.sh logs
      # Nur Bericht, Spuren und Bilder (nie e2e/.stack mit den Zufalls-Secrets)
      - name: Bericht, Spuren und Bilder bei Fehler
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-fehlerbericht
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
