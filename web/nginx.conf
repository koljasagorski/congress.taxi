# Auslieferung der SPA (Phase 6). TLS, CSP, HSTS und Weiterleitung von /api/* an die API
# übernimmt Caddy (Phase 7); dieser Container liefert ausschließlich statische Dateien.

# Kachel-Proxy (Datenschutz): Der Browser lädt Karten von dieser Website (/tiles/...), nicht von OpenStreetMap.
# OSM sieht nur die Adresse dieses Servers – weder IP noch Cookies noch Referer der Nutzer. Der Cache hält
# jede Kachel 7 Tage und schont so den öffentlichen Server (OSM Tile Usage Policy: leichte Nutzung, gültiger
# User-Agent, Attribution). Aktivieren: TILE_URL=/tiles/{z}/{x}/{y}.png (siehe .env.example).
proxy_cache_path /var/cache/tiles levels=1:2 keys_zone=tiles:10m max_size=300m inactive=14d use_temp_path=off;
# Obergrenze aller Kachelabrufe zusammen (konstanter Schlüssel; die Client-Adresse ist hinter Caddy immer gleich)
limit_req_zone "tiles" zone=tilepull:1m rate=100r/s;
limit_req_status 429;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Datenschutz: keine Zugriffsprotokolle (enthielten IP-Adressen), nur Fehler.
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Grundlegende Header; add_header in einer location ersetzt die des Servers, daher in jeder wiederholt.
    # Die vollständigen Sicherheitsheader (CSP, HSTS, ...) setzt Caddy.

    # Liveness für den Compose-Healthcheck
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    # Die API gehört nicht hierher: Caddy leitet /api/* an api:8000. Ein 404 statt SPA-Fallback verhindert,
    # dass fehlgeleitete API-Aufrufe mit HTML und Status 200 beantwortet werden.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":{"code":"not_found","message":"Nicht gefunden"}}';
    }

    # Nur ganzzahlige Kachelnummern (Zoom 0-19): alles andere fällt durch auf die SPA/404 und wird nie weitergeleitet.
    location ~ "^/tiles/(?<tz>[0-9]|1[0-9])/(?<tx>[0-9]{1,6})/(?<ty>[0-9]{1,6})\.png$" {
        limit_except GET HEAD { deny all; }
        limit_req zone=tilepull burst=400 nodelay;

        # Docker-DNS; die Auflösung geschieht erst bei Bedarf, ein Start ohne Internet bleibt möglich.
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $tile_path "$tz/$tx/$ty.png";
        proxy_pass https://tile.openstreetmap.org/$tile_path;

        # Nichts vom Nutzer weitergeben (Cookie, X-Forwarded-For, Referer, User-Agent, Sprache ...).
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_http_version 1.1;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "congress-taxi-tile-cache/1.0 (+https://congress.sgr.ski)";
        proxy_set_header Referer "https://congress.sgr.ski/";
        proxy_set_header Accept "image/png";
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache tiles;
        proxy_cache_key "$tz/$tx/$ty";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;

        proxy_hide_header Set-Cookie;
        proxy_hide_header Via;
        proxy_hide_header X-Served-By;
        proxy_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Alles andere unter /tiles/ (falsche Zoomstufe, Endung, Pfad) ist 404 und nie die SPA.
    location /tiles/ {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Gehashte Build-Artefakte: lange cachen
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html niemals cachen, damit neue Builds sofort greifen
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Übrige statische Dateien (favicon.svg): kurz cachen; SPA-Fallback für alle Unterrouten
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
