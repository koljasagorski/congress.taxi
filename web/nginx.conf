# Auslieferung der SPA (Phase 6). TLS, CSP, HSTS und Weiterleitung von /api/* an die API
# übernimmt Caddy (Phase 7); dieser Container liefert ausschließlich statische Dateien.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Datenschutz: keine Zugriffsprotokolle (enthielten IP-Adressen), nur Fehler.
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Grundlegende Header; add_header in einer location ersetzt die des Servers, daher in jeder wiederholt.
    # Die vollständigen Sicherheitsheader (CSP, HSTS, ...) setzt Caddy.

    # Liveness für den Compose-Healthcheck
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    # Die API gehört nicht hierher: Caddy leitet /api/* an api:8000. Ein 404 statt SPA-Fallback verhindert,
    # dass fehlgeleitete API-Aufrufe mit HTML und Status 200 beantwortet werden.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":{"code":"not_found","message":"Nicht gefunden"}}';
    }

    # Gehashte Build-Artefakte: lange cachen
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html niemals cachen, damit neue Builds sofort greifen
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Übrige statische Dateien (favicon.svg): kurz cachen; SPA-Fallback für alle Unterrouten
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
