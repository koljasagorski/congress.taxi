# Mitfahrer-Matching 40C3 – Compose-Stack (db, osrm, api, web, caddy, cleanup)
# Läuft auf einer Proxmox-VM (Docker Engine + Compose v2). Alle Secrets kommen aus .env.

name: ${COMPOSE_PROJECT_NAME:-mitfahrer}

# Container-Logs rotieren (json-file), damit sie die Platte nicht füllen. Die Anwendungen loggen
# ohnehin sparsam (keine IPs/Koordinaten); das hier begrenzt nur die Größe.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mitfahrer}
      POSTGRES_USER: ${POSTGRES_USER:-mitfahrer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    logging: *default-logging
    ports:
      # nur localhost (Tests, psql); nie öffentlich binden
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:${OSRM_VERSION:-v26.4.0}
    restart: unless-stopped
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data:ro
    ports:
      # nur localhost (Live-Tests, Debugging); OSRM hat keine Authentifizierung
      - "127.0.0.1:${OSRM_PORT:-55000}:5000"
    logging: *default-logging
    # Ohne vorbereitete Daten klar scheitern statt kryptisch abzustürzen.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/map.osrm.mldgr ]; then
          echo "OSRM-Daten fehlen: bitte 'make osrm-prepare' ausführen." >&2
          sleep 20
          exit 1
        fi
        # -l WARNING: Im Standard (INFO) schreibt osrm-routed jede Anfrage mit voller URL ins Log, also
        # Fahrer-Start (= Wohnort) und Abholpunkte mit 6 Nachkommastellen samt Zeitstempel. Diese Logs
        # lägen außerhalb der Retention (und in jeder Sicherung des Hosts). Nicht entfernen!
        exec osrm-routed --algorithm mld --ip 0.0.0.0 --port 5000 -l WARNING /data/map.osrm
    healthcheck:
      # Das Image hat kein curl und OSRM keinen Health-Endpoint; ein Koordinaten-Request wäre
      # extrakt-abhängig (HTTP 400 bei NoSegment). Port-Check genügt als "Prozess läuft";
      # fachliche Prüfung (Ziel im Extrakt?) macht /api/health/ready der API.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # Einmal-Job für osrm-extract/partition/customize – nur über 'make osrm-prepare'
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:${OSRM_VERSION:-v26.4.0}
    profiles: ["tools"]
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data
    entrypoint: ["/bin/sh"]

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      OSRM_URL: http://osrm:5000
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Standard: nur localhost. Auf der Proxmox-Zielmaschine (deploy/hel/) bindet API_BIND die
      # interne Adresse, damit der Rand-Caddy auf einem anderen Gast die API erreicht – nie 0.0.0.0.
      # Veröffentlichte Docker-Ports umgehen die nft-input-Kette: Zugriffsbeschränkung auf den
      # Rand-Caddy macht dort die forward-Regel in deploy/hel/nftables.conf.
      #   Mit dem Compose-Profil "proxy" entfällt die Veröffentlichung ganz (docker-compose.proxy.yml).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # --- web (Phase 6) ---
  # Statische SPA (nginx, Port 8080 im Container). Caddy (Phase 7) leitet /api/* an api:8000, alles
  # andere an web:8080. Optionale Variablen (nicht in .env.example nötig): WEB_BIND, WEB_PORT.
  web:
    build:
      context: ./web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - tile-cache:/var/cache/tiles
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      # Standard: nur localhost. Auf der Proxmox-Zielmaschine analog zu API_BIND die interne Adresse setzen.
      # Mit dem Compose-Profil "proxy" entfällt die Veröffentlichung ganz (docker-compose.proxy.yml).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
  # --- Ende web (Phase 6) ---

  # --- caddy/cleanup (Phase 7) ---
  # Reverse Proxy mit automatischem TLS. Nur mit Profil "proxy" (COMPOSE_PROFILES=proxy), damit
  # Port 80/443 nicht kollidiert, wenn davor schon ein Rand-Proxy steht (z. B. deploy/hel/).
  # Konfiguration und Datenschutz-Hinweise: caddy/Caddyfile. Upstreams (api, web) werden pro
  # Request aufgelöst; Caddy startet aber erst, wenn beide gesund sind.
  caddy:
    image: caddy:2.11.8-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${DOMAIN:-localhost}}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TILE_URL: ${TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
      CADDY_HSTS: ${CADDY_HSTS:-max-age=31536000}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Container und Host nutzen dieselben Portnummern (Weiterleitungen http->https stimmen dann)
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    # Nur im Netz "proxy" (nicht zusätzlich "default"): Der Hostname "api" muss für Caddy eindeutig
    # auf die Adresse im Netz "proxy" zeigen. Dort hängt die API über docker-compose.proxy.yml.
    networks:
      proxy:
        # Feste Adresse: Nur sie darf der API X-Forwarded-For „beglaubigen“ (TRUSTED_PROXIES =
        # genau diese /32, siehe docker-compose.proxy.yml) – nie ein ganzes Docker-Netz.
        ipv4_address: ${CADDY_IPV4:-172.29.71.2}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # HTTP-Port: lauscht in beiden Betriebsarten (TLS: Weiterleitung auf https; http://-Adresse:
      # eigentlicher Dienst), der HTTPS-Port nur im TLS-Betrieb.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${HTTP_PORT:-80}"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Retention-Cleanup: löscht alle Daten nach EVENT_END_DATE + RETENTION_DAYS_AFTER_EVENT
  # (Tagesende UTC), alle 6 Stunden. Verweigert (Exit 3, Container unhealthy), wenn Daten später als
  # 1 Tag nach Fristablauf entstanden sind (falsches Datum); CLEANUP_CONFIRM_EXPIRED=1 bestätigt. Gleiches Image und gleiche Konfiguration wie die API,
  # kein Port. Einmalig/manuell: make cleanup  (DRY=1 zählt nur). Logs sparsam: eine Zeile pro Lauf.
  cleanup:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      # api führt beim Start die Migrationen aus; erst danach existieren die Tabellen
      api:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          if python -m app.cleanup; then touch /tmp/cleanup.ok; wait_s=21600; else wait_s=600; fi
          sleep $$wait_s & wait $$!
        done
    healthcheck:
      # gesund = letzter erfolgreicher Lauf liegt weniger als 7 Stunden zurück
      test: ["CMD-SHELL", "find /tmp/cleanup.ok -mmin -420 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

networks:
  # Eigenes Netz NUR zwischen Caddy und API (kein Eingriff in das Standardnetz): festes Subnetz,
  # damit Caddy eine feste Adresse hat. Angelegt wird es nur, wenn ein Dienst es nutzt (also nur mit
  # dem Profil "proxy"). Bei Überschneidung mit einem Hostnetz CADDY_SUBNET/CADDY_IPV4/
  # CADDY_IP_RANGE gemeinsam ändern. Docker vergibt automatische Adressen nur aus ip_range (obere
  # Hälfte), sonst bekäme die API (startet vor Caddy) die feste Adresse von Caddy.
  proxy:
    ipam:
      config:
        - subnet: ${CADDY_SUBNET:-172.29.71.0/24}
          ip_range: ${CADDY_IP_RANGE:-172.29.71.128/25}

volumes:
  db-data:
  tile-cache:
  caddy-data:
  caddy-config:
