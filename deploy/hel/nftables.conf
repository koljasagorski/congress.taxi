#!/usr/sbin/nft -f
# Firewall von CT 220 „congress" auf hel → /etc/nftables.conf. Grundlage: gast-grundlage.sh aus dem
# Repository patchletter.com (deploy/hel/), verschärft:
#   - SSH nur vom Wirt hel (vmbr1 = 10.10.10.1 / 2a01:4f9:3b:44ad:1::1). Der Gast hat keine
#     öffentliche Adresse; Zugang per ProxyJump über hel, Notweg `ssh hel pct enter 220`.
#   - API (Port 8000) nur für den Rand-Caddy in CT 180 „sgr" (10.10.10.70 / 2a01:4f9:3b:44ad:1::70).
# Eigene Tabelle, flusht nichts Fremdes (Docker verwaltet ip/ip6 nat+filter über iptables-nft).
table inet gast
delete table inet gast
table inet gast {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    iifname "eth0" ip saddr 10.10.10.1 tcp dport 22 accept
    iifname "eth0" ip6 saddr 2a01:4f9:3b:44ad:1::1 tcp dport 22 accept
    # Port 8000 nur vom Rand (sgr). Greift für alles, was ein Prozess auf dem Gast selbst annimmt.
    ip saddr 10.10.10.70 tcp dport 8000 accept
    ip6 saddr 2a01:4f9:3b:44ad:1::70 tcp dport 8000 accept
  }

  # Veröffentlichte Docker-Ports laufen über DNAT → forward und sehen die input-Kette nie.
  # Deshalb hier: was ursprünglich an 10.10.10.80:8000 ging und nicht von sgr kommt, verwerfen.
  # Nur Richtung „original" prüfen – sonst träfe die Regel die Antworten des Containers.
  # Ein drop in dieser Tabelle ist endgültig, egal was Dockers eigene Ketten danach erlauben.
  # (Die API ist nur an die IPv4-Adresse gebunden – für IPv6 gibt es keinen veröffentlichten Port.)
  chain forward {
    type filter hook forward priority -5; policy accept;
    ct direction original meta l4proto tcp ct original ip daddr 10.10.10.80 ct original proto-dst 8000 ip saddr != 10.10.10.70 counter drop
  }
}
